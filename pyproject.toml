[project]
name = "sdxl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "compel>=2.4.0",
    "duckdb>=1.5.5",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "pyzes>=0.1.2",
    "ruff>=0.16.9",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/xpu"

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]

[tool.ruff]
extend-exclude = ["archived/"]
